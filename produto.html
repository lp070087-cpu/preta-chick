<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peça — Preta Chik Moda Praia</title>
<meta name="description" content="Detalhes da peça, tamanhos disponíveis e como comprar na Preta Chik Moda Praia.">
<meta name="theme-color" content="#0f1116">
<link rel="icon" href="assets/img/logo/preta-chik.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/paginas.css">
</head>
<body>

<a class="pular" href="#conteudo">Ir para o conteúdo</a>
<div data-shell-topo></div>

<main id="conteudo">
  <div class="envelope">
    <nav class="migalha" aria-label="Você está em">
      <a href="index.html">Início</a> <span aria-hidden="true">/</span>
      <a href="loja.html" id="migalhaLoja">Loja</a> <span aria-hidden="true">/</span>
      <span aria-current="page" id="migalhaPeca">Peça</span>
    </nav>

    <div class="prod prod--esq" style="padding-bottom:clamp(2.5rem,6vw,5rem)" id="produto" aria-busy="true">
      <!-- skeleton da peça: mesmas proporções da galeria e do bloco de compra; o JS troca pelo conteúdo real -->
      <div class="prod__galeria" aria-hidden="true">
        <div class="prod__principal"><div class="midia" style="aspect-ratio:4/5"></div></div>
        <div class="prod__tiras"><span class="prod__tira"><span class="midia" style="display:block"></span></span><span class="prod__tira"><span class="midia" style="display:block"></span></span></div>
      </div>
      <div class="prod__info" aria-hidden="true">
        <div class="prod__h1-esq"><span class="esq-texto" style="--l:78%">&nbsp;</span></div>
        <div class="prod__meta"><span class="esq-texto" style="--l:13em">&nbsp;</span></div>
        <div class="prod__preco"><span class="consulta"><span class="esq-texto" style="--l:7em">&nbsp;</span></span><span class="nota"><span class="esq-texto" style="--l:18em">&nbsp;</span></span></div>
        <div class="prod__grupo"><span class="rotulo"><span class="esq-texto" style="--l:5em">&nbsp;</span></span><div class="tamanhos"><button type="button" class="esq-bloco" disabled tabindex="-1">PP</button><button type="button" class="esq-bloco" disabled tabindex="-1">P</button><button type="button" class="esq-bloco" disabled tabindex="-1">M</button><button type="button" class="esq-bloco" disabled tabindex="-1">G</button><button type="button" class="esq-bloco" disabled tabindex="-1">GG</button></div></div>
        <div class="prod__grupo"><span class="rotulo"><span class="esq-texto" style="--l:3em">&nbsp;</span></span><div class="cores"><span class="esq-bloco" style="width:30px;height:30px;border-radius:50%"></span><span class="esq-bloco" style="width:30px;height:30px;border-radius:50%"></span></div></div>
        <div class="prod__compra"><span class="bt bt--largo esq-bloco">&nbsp;</span></div>
        <span class="bt bt--largo esq-bloco">&nbsp;</span>
      </div>
      <p class="so-leitor" role="status">Carregando a peça…</p>
    </div>

    <section class="secao" style="border-top:1px solid var(--linha)">
      <div class="cabeca linha-topo">
        <div>
          <span class="em em--rosa rev">Combina com</span>
          <h2 class="t-2 rev" style="--atraso:60ms">Você também vai gostar</h2>
        </div>
        <a class="lk lk-seta rev" href="loja.html">Ver a loja <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
      <div class="grade-produtos" id="gradeRelacionados" aria-busy="true">
      <!-- skeleton: some quando o JS desenha as peças -->
      <article class="cartao cartao--esq" aria-hidden="true"><div class="cartao__midia"></div><div class="cartao__txt"><span class="cartao__cat"><span class="esq-texto" style="--l:5em">&nbsp;</span></span><div class="cartao__nome"><span class="esq-texto" style="--l:86%">&nbsp;</span></div><div class="cartao__preco"><span class="consulta"><span class="esq-texto" style="--l:6.5em">&nbsp;</span></span></div><div class="cartao__tams"><span class="esq-bloco">PP</span><span class="esq-bloco">P</span><span class="esq-bloco">M</span><span class="esq-bloco">G</span><span class="esq-bloco">GG</span></div><div class="cartao__cores"><i class="esq-bloco"></i><i class="esq-bloco"></i></div></div></article>
      <article class="cartao cartao--esq" aria-hidden="true"><div class="cartao__midia"></div><div class="cartao__txt"><span class="cartao__cat"><span class="esq-texto" style="--l:6.5em">&nbsp;</span></span><div class="cartao__nome"><span class="esq-texto" style="--l:72%">&nbsp;</span></div><div class="cartao__preco"><span class="consulta"><span class="esq-texto" style="--l:6.5em">&nbsp;</span></span></div><div class="cartao__tams"><span class="esq-bloco">PP</span><span class="esq-bloco">P</span><span class="esq-bloco">M</span><span class="esq-bloco">G</span><span class="esq-bloco">GG</span></div><div class="cartao__cores"><i class="esq-bloco"></i><i class="esq-bloco"></i></div></div></article>
      <article class="cartao cartao--esq" aria-hidden="true"><div class="cartao__midia"></div><div class="cartao__txt"><span class="cartao__cat"><span class="esq-texto" style="--l:4.5em">&nbsp;</span></span><div class="cartao__nome"><span class="esq-texto" style="--l:92%">&nbsp;</span></div><div class="cartao__preco"><span class="consulta"><span class="esq-texto" style="--l:6.5em">&nbsp;</span></span></div><div class="cartao__tams"><span class="esq-bloco">PP</span><span class="esq-bloco">P</span><span class="esq-bloco">M</span><span class="esq-bloco">G</span><span class="esq-bloco">GG</span></div><div class="cartao__cores"><i class="esq-bloco"></i><i class="esq-bloco"></i></div></div></article>
      <article class="cartao cartao--esq" aria-hidden="true"><div class="cartao__midia"></div><div class="cartao__txt"><span class="cartao__cat"><span class="esq-texto" style="--l:6em">&nbsp;</span></span><div class="cartao__nome"><span class="esq-texto" style="--l:64%">&nbsp;</span></div><div class="cartao__preco"><span class="consulta"><span class="esq-texto" style="--l:6.5em">&nbsp;</span></span></div><div class="cartao__tams"><span class="esq-bloco">PP</span><span class="esq-bloco">P</span><span class="esq-bloco">M</span><span class="esq-bloco">G</span><span class="esq-bloco">GG</span></div><div class="cartao__cores"><i class="esq-bloco"></i><i class="esq-bloco"></i></div></div></article>
    </div>
    </section>
  </div>
</main>

<div data-shell-pe></div>

<script src="assets/js/dados.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  LB.iniciar({ pagina: "produto" });

  var qs = new URLSearchParams(location.search);
  var id = qs.get("id") || "p01";
  var alvo = document.querySelector("#produto");

  function naoEncontrado() {
    alvo.removeAttribute("aria-busy");
    alvo.classList.remove("prod--esq");
    LB.trocarSuave(alvo,
      '<div class="loja__vazio" style="grid-column:1/-1"><b>Não encontramos essa peça</b>' +
      '<p class="texto-peq" style="margin-bottom:1.4rem">Ela pode ter saído da arara. Veja as novidades da loja.</p>' +
      '<a class="bt bt--rosa bt--pequeno" href="loja.html">Ver a loja</a></div>');
    var rel = document.querySelector("#gradeRelacionados");
    if (rel) { rel.innerHTML = ""; rel.removeAttribute("aria-busy"); }
    // se o catálogo do servidor chegar atrasado (depois do limite) e trouxer a peça
    document.addEventListener("lb:catalogo", function tardio(e) {
      var q = e.detail && e.detail.ok ? buscaProduto(id) : null;
      if (q) { document.removeEventListener("lb:catalogo", tardio); montar(q); }
    });
  }

  /* Peças cadastradas só no painel não estão em dados.js: elas chegam com o
     catálogo do servidor. Enquanto ele responde, o skeleton da peça fica na
     tela — antes aparecia "Não encontramos essa peça" e depois nada mudava. */
  var inicial = buscaProduto(id);
  if (inicial) montar(inicial);
  else if (LB.catalogoCarregando()) LB.catalogo().then(function () { var q = buscaProduto(id); if (q) montar(q); else naoEncontrado(); });
  else naoEncontrado();

  function montar(p) {
  document.title = p.nome + " — Preta Chik Moda Praia";
  document.querySelector("#migalhaPeca").textContent = p.nome;
  document.querySelector("#migalhaLoja").textContent = p.cat;
  document.querySelector("#migalhaLoja").href = "loja.html?cat=" + p.cat;

  var seloTam = null;
  var corEscolhida = p.cor;
  var qtd = 1;

  var FOTOS = [
    { src: fotoProduto(p, "a"), alt: p.nome + " — " + p.cor },
    { src: fotoProduto(p, "b"), alt: p.nome + " — segunda foto" }
  ];
  var fotoAtual = 0;

  var badges = p.badges.map(function (b) {
    return '<span class="selo' + (b === "Novo" ? " selo--rosa" : "") + '">' + LB.escapa(b) + '</span>';
  }).join("");

  alvo.removeAttribute("aria-busy");
  alvo.classList.remove("prod--esq");
  alvo.innerHTML = '' +
  '<div class="prod__galeria">' +
    '<div class="prod__principal">' +
      '<div class="midia"><img id="fotoPrincipal" src="' + FOTOS[0].src + '" alt="' + LB.escapa(FOTOS[0].alt) + '" width="720" height="900"></div>' +
      '<div class="prod__principais">' +
        FOTOS.map(function (f, i) {
          return '<button type="button" data-foto="' + i + '"' + (i === 0 ? ' class="on"' : '') + ' aria-label="Foto ' + (i + 1) + '"></button>';
        }).join("") +
      '</div>' +
    '</div>' +
    '<div class="prod__tiras">' +
      FOTOS.map(function (f, i) {
        return '<button class="prod__tira' + (i === 0 ? " on" : "") + '" type="button" data-foto="' + i + '" aria-label="Ver foto ' + (i + 1) + '">' +
          '<span class="midia"><img src="' + f.src + '" alt="" loading="lazy" width="720" height="900"></span></button>';
      }).join("") +
    '</div>' +
  '</div>' +

  '<div class="prod__info">' +
    (badges ? '<div class="prod__selos">' + badges + '</div>' : '') +
    '<h1>' + LB.escapa(p.nome) + '</h1>' +
    '<div class="prod__meta">' +
      '<span>Peça nova na arara</span>' +
      '<span aria-hidden="true">·</span>' +
      '<span>Cor ' + LB.escapa(p.cor) + '</span>' +
    '</div>' +

    '<div class="prod__preco" id="prodPreco"></div>' +

    '<div class="prod__grupo">' +
      '<span class="rotulo">Tamanho <a href="trocas.html">Guia e trocas</a></span>' +
      '<div class="tamanhos" data-tams-produto></div>' +
      '<p class="prod__estoque texto-peq" id="prodEstoque" aria-live="polite"></p>' +
    '</div>' +

    '<div class="prod__grupo">' +
      '<span class="rotulo">Cor</span>' +
      '<select class="entrada" id="corProduto" aria-label="Cor"></select>' +
    '</div>' +
    '</div>' +

    '<div class="prod__compra">' +
      '<span class="passo">' +
        '<button type="button" id="menos" aria-label="Diminuir quantidade">−</button>' +
        '<span id="qtdValor" aria-live="polite">1</span>' +
        '<button type="button" id="mais" aria-label="Aumentar quantidade">+</button>' +
      '</span>' +
      '<button class="bt bt--rosa" type="button" id="addSacola">Adicionar à sacola</button>' +
    '</div>' +
    '<button class="bt bt--vazio bt--largo" type="button" id="comprarAtendimento">Comprar agora</button>' +
    '<button class="bt bt--vazio bt--largo" type="button" id="addFavorito">Salvar nos favoritos</button>' +

    '<ul class="prod__extra">' +
      '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>Enviamos para todo o Brasil — você calcula o frete pelo CEP na sacola.</span></li>' +
      '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg><span>Está perto da loja? Também tem entrega local.</span></li>' +
      '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2"/><path d="M18 2v5h-5M6 22v-5h5"/></svg><span>7 dias corridos para troca nas compras on-line, com a etiqueta original.</span></li>' +
    '</ul>' +

    '<div class="acordeao prod__acordeao">' +
      '<div class="acordeao__item">' +
        '<button class="acordeao__bt" type="button" aria-expanded="false">Como comprar<i></i></button>' +
        '<div class="acordeao__painel"><div class="acordeao__dentro">' +
          '<p class="texto-peq">Escolha o tamanho e a cor e adicione à sacola. Na sacola você escolhe a entrega, informa como prefere pagar e envia o pedido pelo <strong>WhatsApp</strong>. Nossa equipe confere a disponibilidade, sugere combinações e conclui a compra com você.</p>' +
          '<p class="texto-peq"><a class="lk" href="https://wa.me/5581984023286" target="_blank" rel="noopener">Falar com a loja agora</a></p>' +
        '</div></div>' +
      '</div>' +
      '<div class="acordeao__item">' +
        '<button class="acordeao__bt" type="button" aria-expanded="false">Trocas e devoluções<i></i></button>' +
        '<div class="acordeao__painel"><div class="acordeao__dentro">' +
          '<p class="texto-peq">Compras on-line têm <strong>7 dias corridos</strong> para troca e compras presenciais têm <strong>3 dias corridos</strong>, desde que a peça esteja em perfeito estado e com a etiqueta original.</p>' +
          '<p class="texto-peq">Não realizamos troca de peças brancas, rendas, delicadas, tricô, promocionais, acessórios e bolsas.</p>' +
          '<p class="texto-peq"><a class="lk" href="trocas.html">Ler a política completa</a></p>' +
        '</div></div>' +
      '</div>' +
      '<div class="acordeao__item">' +
        '<button class="acordeao__bt" type="button" aria-expanded="false">Entrega<i></i></button>' +
        '<div class="acordeao__painel"><div class="acordeao__dentro">' +
          '<p class="texto-peq">Na sacola você digita o seu CEP e vê as opções: <strong>retirada na loja</strong>, <strong>entrega local</strong> (combinada com a loja) e, quando o cálculo automático estiver ativo, o envio pelos Correios e transportadoras para todo o Brasil.</p>' +
        '</div></div>' +
      '</div>' +
    '</div>' +
  '</div>';
  // no lugar do skeleton: fade discreto, sem salto (mesmas proporções)
  alvo.classList.remove("surge"); void alvo.offsetWidth; alvo.classList.add("surge");

  /* ------------------------------------------- preço e tamanhos reais */
  function pintarCompra() {
    var preco = document.querySelector("#prodPreco");
    var caixa = document.querySelector("[data-tams-produto]");
    if (!p.tamanhos && LB.catalogoCarregando()) {
      // preço e estoque reais a caminho: skeleton com as mesmas medidas
      preco.innerHTML = LB.precoHTML(p) + '<span class="nota">' + LB.esqTexto("18em") + '</span>';
      caixa.innerHTML = TAMANHOS.map(function (t) {
        return '<button type="button" class="esq-bloco" disabled aria-hidden="true" tabindex="-1">' + t + '</button>';
      }).join("");
      seloTam = null;
      document.querySelector("#prodEstoque").textContent = "";
      return;
    }
    LB.trocarSuave(preco, LB.precoHTML(p) +
      '<span class="nota">' + (temPreco(p)
        ? "Finalize o pedido com atendimento exclusivo pelo WhatsApp."
        : "O valor é informado pela loja no atendimento exclusivo pelo WhatsApp.") + '</span>');
    var cores = coresDisponiveis(p);
    if (cores.indexOf(corEscolhida) < 0) corEscolhida = cores[0] || "";
    var seletor = document.querySelector("#corProduto");
    seletor.innerHTML = cores.map(function (cor) {
      return '<option value="' + LB.escapa(cor) + '">' + LB.escapa(cor || "Cor da peça") + '</option>';
    }).join("");
    seletor.disabled = cores.length < 2;
    seletor.value = corEscolhida;
    pintarTamanhos();
  }
  function pintarTamanhos() {
    var caixa = document.querySelector("[data-tams-produto]");
    var selecionado = produtoDaCor(p, corEscolhida);
    LB.trocarSuave(caixa, LB.botoesTamanho(selecionado));
    var on = caixa.querySelector("button.on");
    seloTam = on ? on.getAttribute("data-tam") : null;
    pintarEstoque();
    var esg = !seloTam;
    document.querySelector("#addSacola").disabled = esg;
    document.querySelector("#comprarAtendimento").disabled = esg;
    document.querySelector("#addSacola").textContent = esg ? "Esgotado" : "Adicionar à sacola";
  }
  function pintarEstoque() {
    var el = document.querySelector("#prodEstoque");
    var selecionado = produtoDaCor(p, corEscolhida);
    if (!seloTam) { el.textContent = "Nenhum tamanho disponível nesta cor."; return; }
    var sit = situacaoTamanho(selecionado, seloTam), qtdEst = null;
    (selecionado.tamanhos || []).forEach(function (t) { if (t.tam === seloTam) qtdEst = t.estoque; });
    el.textContent = sit === "ok" ? (qtdEst <= 3 ? "Últimas " + qtdEst + " unidades no tamanho " + seloTam + "." : "Disponível no tamanho " + seloTam + ".")
      : sit === "consulta" ? "Disponibilidade do tamanho " + seloTam + " confirmada pela loja no atendimento." : "";
  }
  pintarCompra();
  document.addEventListener("lb:catalogo", pintarCompra);
  document.querySelector("#corProduto").addEventListener("change", function (e) {
    corEscolhida = e.currentTarget.value;
    pintarTamanhos();
  });

  /* --------------------------------------------------------- interacoes */
  function trocarFoto(i) {
    fotoAtual = i;
    document.querySelector("#fotoPrincipal").src = FOTOS[i].src;
    document.querySelector("#fotoPrincipal").alt = FOTOS[i].alt;
    var botoes = document.querySelectorAll("[data-foto]");
    for (var k = 0; k < botoes.length; k++) {
      botoes[k].classList.toggle("on", parseInt(botoes[k].getAttribute("data-foto"), 10) === i);
    }
  }

  document.addEventListener("click", function (e) {
    var f = e.target.closest("[data-foto]");
    if (f) { trocarFoto(parseInt(f.getAttribute("data-foto"), 10)); return; }

    var t = e.target.closest("[data-tams-produto] [data-tam]");
    if (t && !t.disabled) {
      var grupo = t.parentNode;
      var bs = grupo.querySelectorAll("button");
      for (var i = 0; i < bs.length; i++) bs[i].classList.remove("on");
      t.classList.add("on"); seloTam = t.getAttribute("data-tam");
      pintarEstoque();
      return;
    }

  });

  document.querySelector("#mais").addEventListener("click", function () {
    qtd = Math.min(9, qtd + 1); document.querySelector("#qtdValor").textContent = qtd;
  });
  document.querySelector("#menos").addEventListener("click", function () {
    qtd = Math.max(1, qtd - 1); document.querySelector("#qtdValor").textContent = qtd;
  });
  document.querySelector("#addSacola").addEventListener("click", function () {
    if (!seloTam && LB.catalogoCarregando()) { LB.toast("Conferindo os tamanhos disponíveis…"); return; }
    if (!seloTam) { LB.toast("Escolha um tamanho disponível"); return; }
    LB.adicionar(p.id, corEscolhida, seloTam, qtd);
  });
  document.querySelector("#comprarAtendimento").addEventListener("click", function () {
    if (!seloTam && LB.catalogoCarregando()) { LB.toast("Conferindo os tamanhos disponíveis…"); return; }
    if (!seloTam) { LB.toast("Escolha um tamanho disponível"); return; }
    LB.adicionar(p.id, corEscolhida, seloTam, qtd);
    location.href = "sacola.html";
  });
  function pintarBotaoFavorito() {
    var bt = document.querySelector("#addFavorito");
    if (!bt) return;
    var on = LB.ehFavorito(p.id);
    bt.textContent = on ? "Salvo nos favoritos ✓" : "Salvar nos favoritos";
    bt.classList.toggle("bt--rosa", false);
    bt.classList.toggle("bt--vazio", !on);
  }
  document.querySelector("#addFavorito").addEventListener("click", function () {
    LB.alternarFavorito(p.id);
    pintarBotaoFavorito();
  });
  pintarBotaoFavorito();

  /* ------------------------------------------------------- relacionados */
  var irmaos = PRODUTOS.filter(function (x) { return x.cat === p.cat && x.id !== p.id; });
  if (irmaos.length < 4) {
    var extras = PRODUTOS.filter(function (x) { return x.cat !== p.cat && x.id !== p.id; });
    irmaos = irmaos.concat(extras).slice(0, 4);
  }
  LB.desenharCartoes("#gradeRelacionados", irmaos.slice(0, 4));
  }
})();
</script>
</body>
</html>
