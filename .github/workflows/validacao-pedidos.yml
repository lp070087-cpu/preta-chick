name: Validação isolada de pedidos
on:
  push:
    branches: [validacao-pedidos-codigo]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: preta_chik_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/preta_chik_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/pedidos-whatsapp.test.js
